android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=false
android.nonTransitiveRClass=true

# AGP downloads its own x86-64 aapt2; point it at the QEMU-wrapped SDK build-tools one.
android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/35.0.0/aapt2
